services:
  migrate:
    image: ${BRIGHTBEAN_IMAGE:-ghcr.io/krishramani111/brightbean-studio:latest}
    build: .
    command: python manage.py migrate --noinput
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: ${BRIGHTBEAN_IMAGE:-ghcr.io/krishramani111/brightbean-studio:latest}
    build: .
    volumes:
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: ${BRIGHTBEAN_IMAGE:-ghcr.io/krishramani111/brightbean-studio:latest}
    build: .
    command: python manage.py process_tasks
    volumes:
      - media_data:/app/media
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: brightbean
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  media_data:
